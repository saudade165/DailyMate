<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>DailyMate — Your day, organized.</title>
  <meta name="description" content="DailyMate helps you plan your day, manage tasks and remember what matters.">
  <meta name="theme-color" content="#F5F8FC">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>

  <!-- Icon sprite: referenced via <use href="#i-name"> -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5" fill="currentColor" stroke="none"/><path d="M12 2.5v2.2M12 19.3v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6"/></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></symbol>
      <symbol id="i-home" viewBox="0 0 24 24"><path d="M3.5 10.5 12 3.5l8.5 7V20a1 1 0 0 1-1 1h-5v-6h-5v6h-5a1 1 0 0 1-1-1z"/></symbol>
      <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></symbol>
      <symbol id="i-sparkle" viewBox="0 0 24 24"><path d="M12 3c.6 4.6 2.4 6.4 7 7-4.6.6-6.4 2.4-7 7-.6-4.6-2.4-6.4-7-7 4.6-.6 6.4-2.4 7-7z"/></symbol>
      <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6.5h11M9 12h11M9 17.5h11"/><circle cx="4.75" cy="6.5" r="1" fill="currentColor"/><circle cx="4.75" cy="12" r="1" fill="currentColor"/><circle cx="4.75" cy="17.5" r="1" fill="currentColor"/></symbol>
      <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 16.5V11a6 6 0 1 1 12 0v5.5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></symbol>
      <symbol id="i-chart" viewBox="0 0 24 24"><path d="M5 20V13M10 20V8M15 20v-5M20 20V4"/></symbol>
      <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1" fill="currentColor"/></symbol>
      <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20.5c1.2-3.8 4.3-5.5 8-5.5s6.8 1.7 8 5.5"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
      <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
      <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13.5 6.5 4 4"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4.5 7h15M10 7V4.5h4V7M6.5 7l1 13h9l1-13M10 11v5.5M14 11v5.5"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
      <symbol id="i-check-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12.3 2.8 2.8L16.2 9.6"/></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
      <symbol id="i-flag" viewBox="0 0 24 24"><path d="M5.5 21V4M5.5 4.5h11l-2 4 2 4h-11"/></symbol>
      <symbol id="i-chevron-left" viewBox="0 0 24 24"><path d="m14.5 6-6 6 6 6"/></symbol>
      <symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="m9.5 6 6 6-6 6"/></symbol>
      <symbol id="i-crown" viewBox="0 0 24 24"><path d="M4 17.5 3 7.5l5 4 4-6 4 6 5-4-1 10z" fill="currentColor" stroke="none"/><path d="M4.5 20h15"/></symbol>
      <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4 2.8 19.5h18.4z"/><path d="M12 10v4.5M12 17.2v.3"/></symbol>
      <symbol id="i-arrow-right" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
      <symbol id="i-inbox" viewBox="0 0 24 24"><path d="M3.5 13.5 6 5h12l2.5 8.5V19a1.5 1.5 0 0 1-1.5 1.5H5A1.5 1.5 0 0 1 3.5 19z"/><path d="M3.5 13.5H9a3 3 0 0 0 6 0h5.5"/></symbol>
      <symbol id="i-tools" viewBox="0 0 24 24"><path d="M14.5 6.5a4 4 0 0 0 5 5L12 19a2.1 2.1 0 0 1-3-3l7.5-7.5"/><path d="M14.5 6.5 17 4l3 3-2.5 2.5"/></symbol>
    </defs>
  </svg>

  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Main navigation">
      <div class="sidebar__brand">
        <a class="brand" href="#/my-day" aria-label="DailyMate — go to My Day">
          <svg class="brand__icon" aria-hidden="true"><use href="#i-sun"/></svg>
          <span class="brand__name">DailyMate</span>
        </a>
        <button class="icon-btn sidebar__close" type="button" data-action="close-menu" aria-label="Close menu">
          <svg aria-hidden="true"><use href="#i-close"/></svg>
        </button>
      </div>
      <nav>
        <ul class="nav" id="nav"><!-- rendered by nav.js --></ul>
      </nav>
      <div class="sidebar__footer" id="sidebar-plus"><!-- rendered by app.js --></div>
    </aside>
    <div class="scrim" data-action="close-menu" hidden></div>

    <div class="main-col">
      <header class="topbar">
        <button class="icon-btn topbar__menu" type="button" data-action="open-menu" aria-label="Open menu" aria-controls="sidebar" aria-expanded="false">
          <svg aria-hidden="true"><use href="#i-menu"/></svg>
        </button>
        <a class="brand brand--compact" href="#/my-day" aria-label="DailyMate — go to My Day">
          <svg class="brand__icon" aria-hidden="true"><use href="#i-sun"/></svg>
          <span class="brand__name">DailyMate</span>
        </a>
        <form class="search" role="search" id="search-form">
          <label class="visually-hidden" for="search-input">Search your tasks</label>
          <svg class="search__icon" aria-hidden="true"><use href="#i-search"/></svg>
          <input class="search__input" id="search-input" type="search" placeholder="Search your tasks…" autocomplete="off" maxlength="100">
        </form>
        <a class="profile-chip" href="#/profile" id="profile-chip" aria-label="Profile and subscription">
          <span class="avatar" aria-hidden="true" id="profile-initial">?</span>
          <span class="profile-chip__name" id="profile-name"></span>
        </a>
      </header>

      <div class="storage-banner" id="storage-banner" role="alert" hidden></div>

      <main id="main" class="view" tabindex="-1"><!-- rendered by router --></main>
    </div>
  </div>

  <!-- Add / edit task -->
  <dialog class="dialog" id="task-dialog" aria-labelledby="task-dialog-title">
    <form method="dialog" class="dialog__form" id="task-form" novalidate>
      <div class="dialog__header">
        <h2 class="dialog__title" id="task-dialog-title">Add task</h2>
        <button class="icon-btn" type="button" data-action="dialog-cancel" aria-label="Close">
          <svg aria-hidden="true"><use href="#i-close"/></svg>
        </button>
      </div>

      <div class="field">
        <label class="field__label" for="task-title">What do you need to do?</label>
        <input class="input" id="task-title" name="title" type="text" maxlength="200" required
               placeholder="e.g. Call the pharmacy" aria-describedby="task-title-error">
        <p class="field__error" id="task-title-error" hidden></p>
      </div>

      <div class="field-row">
        <div class="field">
          <label class="field__label" for="task-date">Date</label>
          <input class="input" id="task-date" name="date" type="date" required aria-describedby="task-date-error">
          <p class="field__error" id="task-date-error" hidden></p>
        </div>
        <div class="field">
          <label class="field__label" for="task-time">Time <span class="field__optional">(optional)</span></label>
          <input class="input" id="task-time" name="time" type="time">
        </div>
      </div>

      <fieldset class="field">
        <legend class="field__label">Priority</legend>
        <div class="segmented" id="task-priority">
          <label class="segmented__option"><input type="radio" name="priority" value="none" checked><span>None</span></label>
          <label class="segmented__option"><input type="radio" name="priority" value="low"><span>Low</span></label>
          <label class="segmented__option"><input type="radio" name="priority" value="medium"><span>Medium</span></label>
          <label class="segmented__option"><input type="radio" name="priority" value="high"><span>High</span></label>
        </div>
      </fieldset>

      <div class="field">
        <label class="field__label" for="task-notes">Notes <span class="field__optional">(optional)</span></label>
        <textarea class="input textarea" id="task-notes" name="notes" rows="3" maxlength="1000"
                  placeholder="Anything you want to remember about this task"></textarea>
      </div>

      <div class="dialog__actions">
        <button class="btn btn--ghost" type="button" data-action="dialog-cancel">Cancel</button>
        <button class="btn btn--primary" type="submit" id="task-submit">Add task</button>
      </div>
    </form>
  </dialog>

  <!-- Confirmation -->
  <dialog class="dialog dialog--small" id="confirm-dialog" aria-labelledby="confirm-title" aria-describedby="confirm-message">
    <form method="dialog" class="dialog__form">
      <h2 class="dialog__title" id="confirm-title">Delete task?</h2>
      <p class="dialog__text" id="confirm-message"></p>
      <div class="dialog__actions">
        <button class="btn btn--ghost" value="cancel" autofocus>Cancel</button>
        <button class="btn btn--danger" value="confirm" id="confirm-ok">Delete</button>
      </div>
    </form>
  </dialog>

  <div class="toast-region" id="toast-region" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
